services:
  # ==========================================
  # 1Fi Marketplace — Backend API (Express + Prisma)
  # ==========================================
  - type: web
    name: onefi-marketplace-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        value: https://onefi-marketplace.vercel.app

  # ==========================================
  # 1Fi Marketplace — Frontend Static Site (Vite React)
  # ==========================================
  - type: web
    name: onefi-marketplace-web
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: onefi-marketplace-api
          property: host
